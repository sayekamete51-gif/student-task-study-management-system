<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Login</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f4f7fb;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .login-box {
            background: white;
            width: 350px;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.15);
        }

        .login-box h1 {
            text-align: center;
            color: #2563eb;
            margin-bottom: 10px;
        }

        .login-box p {
            text-align: center;
            margin-bottom: 25px;
            color: #666;
        }

        input {
            width: 100%;
            padding: 12px;
            margin-bottom: 15px;
            border: 1px solid #ddd;
            border-radius: 8px;
        }

        button {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 8px;
            background: #2563eb;
            color: white;
            cursor: pointer;
            font-size: 16px;
        }

        button:hover {
            background: #1d4ed8;
        }

    </style>

</head>

<body>

    <div class="login-box">

        <h1>Student Login</h1>

        <p>Welcome back!</p>

        <input
            type="email"
            id="email"
            placeholder="Enter your email"
        >

        <input
            type="password"
            id="password"
            placeholder="Enter your password"
        >

        <button onclick="login()">
            Login
        </button>

    </div>


    <script>

        function login() {

    const email = document.getElementById("email").value.trim();

    const password = document.getElementById("password").value.trim();

    if (email === "" || password === "") {

        alert("Please enter email and password.");

        return;
    }

    localStorage.setItem("loggedIn", "true");

    localStorage.setItem("studentEmail", email);

    alert("Login successful!");

    window.location.href = "index.html";
}

    </script>

</body>

</html>
